display_information:
  name: "Secret"
  description: "One-time secret links for credentials"
  background_color: "#1A1D21"
  long_description: "Create a one-time link for a password or API key. In a direct message, the link is sent as a message. Secret does not post the link in a channel. Opening the link shows the secret in the browser, then the link stops working."

features:
  bot_user:
    display_name: "Secret"
    always_online: true
  slash_commands:
    - command: "/secret"
      url: "https://secret.bsuit.app/slack/commands"
      description: "Create a one-time secret link"
      usage_hint: "[optional text or leave empty for the form]"
      should_escape: false

oauth_config:
  redirect_urls:
    - "https://secret.bsuit.app/slack/oauth/callback"
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public

settings:
  event_subscriptions:
    request_url: "https://secret.bsuit.app/slack/events"
    bot_events:
      - app_uninstalled
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: "https://secret.bsuit.app/slack/interactions"
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
