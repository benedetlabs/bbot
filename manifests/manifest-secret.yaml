display_information:
  name: "Secret"
  description: "Share passwords, API keys, and credentials with ephemeral Zero-Knowledge encryption."
  background_color: "#1A1D21"
  long_description: "Prevent accidental credential leaks in Slack channels. Secrets are encrypted end-to-end using split-key cryptography, stored in ephemeral volatile memory, and permanently burned on read."

features:
  bot_user:
    display_name: "Secret"
    always_online: true
  slash_commands:
    - command: "/secret"
      url: "https://secret.bsuit.app/slack/commands"
      description: "Create and share an ephemeral encrypted secret"
      usage_hint: "[optional secret text or leave empty for modal]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public

settings:
  interactivity:
    is_enabled: true
    request_url: "https://secret.bsuit.app/slack/interactions"
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
