display_information:
  name: "Todo"
  description: "Capture conversational tasks and manage GTD to-dos without leaving Slack."
  background_color: "#1D4ED8"
  long_description: "Turn message requests into actionable tasks with 1-click message shortcuts. Track deadlines in your personal App Home with natural language date parsing."

features:
  bot_user:
    display_name: "Todo"
    always_online: true
  shortcuts:
    - name: "Add to To-Dos"
      type: "message"
      callback_id: "todo_create_from_message"
      description: "Convert this message into a personal or delegated task"
  slash_commands:
    - command: "/todo"
      url: "https://todo.bsuit.app/slack/commands"
      description: "Create and schedule a quick task"
      usage_hint: "[e.g. review staging PR tomorrow at 3pm]"
      should_escape: false
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public

settings:
  event_subscriptions:
    request_url: "https://todo.bsuit.app/slack/events"
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: "https://todo.bsuit.app/slack/interactions"
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
