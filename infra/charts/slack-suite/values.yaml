# ============================================================================
# Valores do Helm Chart: slack-suite (Por Projeto Independente + 4 Node Pools)
# ============================================================================

global:
  imageRegistry: "ghcr.io/benedetlabs"
  imagePullPolicy: IfNotPresent
  imagePullSecretName: "ghcr-secret"

# StorageClass Durável (reclaimPolicy: Retain -> Nunca apaga o disco no uninstall!)
storageClass:
  create: true
  name: "civo-volume-retain"
  provisioner: "csi.civo.com"

# Credenciais e chaves
secrets:
  postgresUser: "suite_user"
  postgresPassword: "CHANGE_ME_STRONG_PASSWORD"
  postgresDb: "slack_suite"
  masterEncryptionKeyHex: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  secretAppSigningSecret: ""
  queueAppSigningSecret: ""
  todoAppSigningSecret: ""
  cloudflareTunnelToken: ""
  openobserveAdminEmail: "benedetlabs@gmail.com"
  openobserveAdminPassword: "CHANGE_ME_OPENOBSERVE_PASSWORD"

# ============================================================================
# POOL 1: BANCO DE DADOS DEDICADO (db-pool: g4s.kube.medium - 4 vCPU, 8 GB RAM)
# ============================================================================
postgres:
  enabled: true
  image: "postgres:18-alpine"
  nodeSelector:
    kubernetes.civo.com/civo-node-pool: "db-pool"
  storageClassName: "civo-volume-retain"
  storageSize: "50Gi"
  sharedBuffers: "2GB"
  effectiveCacheSize: "6GB"
  workMem: "16MB"
  maintenanceWorkMem: "512MB"
  maxConnections: "200"
  resources:
    requests:
      cpu: "1500m"
      memory: "4Gi"
    limits:
      cpu: "3500m"
      memory: "6Gi"
  backup:
    enabled: true
    schedule: "0 */6 * * *"
    storageSize: "20Gi"
    retentionDays: 14

# ============================================================================
# POOL 2: PGCACHE DEDICADO (cache-pool: g4s.kube.small - 2 vCPU, 4 GB RAM)
# ============================================================================
pgcache:
  enabled: true
  image: "pgcache/pgcache:latest"
  nodeSelector:
    kubernetes.civo.com/civo-node-pool: "cache-pool"
  publicationName: "pgcache_suite_pub"
  slotName: "pgcache_suite_slot"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1500m"
      memory: "3Gi"

# ============================================================================
# POOL 3: APLICAÇÕES DENO POR PROJETO + WORKER + TUNNEL (app-pool)
# Cada app tem seu próprio `enabled`, `imageTag` e `replicas` independentes!
# ============================================================================
apps:
  nodeSelector:
    kubernetes.civo.com/civo-node-pool: "app-pool"
  otelEnabled: true
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  projects:
    secret-app:
      enabled: true
      imageTag: "v1.0.0"
      replicas: 2
    queue-app:
      enabled: true
      imageTag: "v1.0.0"
      replicas: 2
    todo-app:
      enabled: true
      imageTag: "v1.0.0"
      replicas: 2

worker:
  enabled: true
  imageTag: "v1.0.0"
  replicas: 2
  nodeSelector:
    kubernetes.civo.com/civo-node-pool: "app-pool"
  otelEnabled: true
  pollIntervalMs: "250"
  batchSize: "25"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

cloudflared:
  enabled: true
  replicas: 2
  nodeSelector:
    kubernetes.civo.com/civo-node-pool: "app-pool"
  image: "cloudflare/cloudflared:latest"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"

# ============================================================================
# POOL 4: OBSERVABILIDADE COMPLETA (obs-pool: g4s.kube.medium - 4 vCPU, 8 GB RAM)
# ============================================================================
openobserve:
  enabled: true
  image: "public.ecr.aws/zinclabs/openobserve:latest"
  nodeSelector:
    kubernetes.civo.com/civo-node-pool: "obs-pool"
  storageClassName: "civo-volume-retain"
  storageSize: "30Gi"
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "3000m"
      memory: "5Gi"
  otelCollector:
    enabled: true
    image: "otel/opentelemetry-collector-contrib:latest"

networkPolicy:
  enabled: true
