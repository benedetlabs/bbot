{{- $otelAuth := printf "%s:%s" .Values.secrets.openobserveAdminEmail .Values.secrets.openobserveAdminPassword | b64enc -}}
apiVersion: v1
kind: Secret
metadata:
  name: suite-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  PORT: "8080"
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  DATABASE_ORIGIN_URL: {{ printf "postgres://%s:%s@postgres-origin-svc:5432/%s" .Values.secrets.postgresUser .Values.secrets.postgresPassword .Values.secrets.postgresDb | quote }}
  PGCACHE_URL: {{ printf "postgres://%s:%s@pgcache-svc:5433/%s" .Values.secrets.postgresUser .Values.secrets.postgresPassword .Values.secrets.postgresDb | quote }}
  MASTER_ENCRYPTION_KEY_HEX: {{ .Values.secrets.masterEncryptionKeyHex | quote }}
  SECRET_APP_CLIENT_ID: {{ .Values.secrets.secretAppClientId | quote }}
  SECRET_APP_CLIENT_SECRET: {{ .Values.secrets.secretAppClientSecret | quote }}
  SECRET_PUBLIC_BASE_URL: {{ .Values.secrets.secretPublicBaseUrl | quote }}
  SECRET_APP_SIGNING_SECRET: {{ .Values.secrets.secretAppSigningSecret | quote }}
  QUEUE_APP_SIGNING_SECRET: {{ .Values.secrets.queueAppSigningSecret | quote }}
  TODO_APP_SIGNING_SECRET: {{ .Values.secrets.todoAppSigningSecret | quote }}
  SECRET_APP_BOT_TOKEN: {{ .Values.secrets.secretAppBotToken | quote }}
  QUEUE_APP_BOT_TOKEN: {{ .Values.secrets.queueAppBotToken | quote }}
  TODO_APP_BOT_TOKEN: {{ .Values.secrets.todoAppBotToken | quote }}
  GATEKEEP_APP_SIGNING_SECRET: {{ .Values.secrets.gatekeepAppSigningSecret | quote }}
  GATEKEEP_APP_BOT_TOKEN: {{ .Values.secrets.gatekeepAppBotToken | quote }}
  GATEKEEP_APP_CLIENT_ID: {{ .Values.secrets.gatekeepAppClientId | quote }}
  GATEKEEP_APP_CLIENT_SECRET: {{ .Values.secrets.gatekeepAppClientSecret | quote }}
  GATEKEEP_PUBLIC_BASE_URL: {{ .Values.secrets.gatekeepPublicBaseUrl | quote }}
  # Credenciais do OpenObserve e Header OTLP pré-codificado para o Deno
  ZO_ROOT_USER_EMAIL: {{ .Values.secrets.openobserveAdminEmail | quote }}
  ZO_ROOT_USER_PASSWORD: {{ .Values.secrets.openobserveAdminPassword | quote }}
  OPENOBSERVE_BASIC_AUTH: {{ printf "Basic %s" $otelAuth | quote }}
---
{{- if .Values.cloudflared.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-token
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  TUNNEL_TOKEN: {{ .Values.secrets.cloudflareTunnelToken | quote }}
{{- end }}
