# ============================================================================
# OPENTELEMETRY DATABASE & CACHE COLLECTOR (PostgreSQL 18 & PgCache Proxy)
# Scrapes pg_stat_statements, locks, deadlocks, connections, and cache metrics
# and exports directly to SigNoz ClickHouse.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-collector-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    receivers:
      postgresql:
        endpoint: postgres-origin-svc.{{ .Release.Namespace }}.svc.cluster.local:5432
        transport: tcp
        username: "${env:POSTGRES_USER}"
        password: "${env:POSTGRES_PASSWORD}"
        databases:
          - "${env:POSTGRES_DB}"
        collection_interval: 10s
        tls:
          insecure: true
        metrics:
          postgresql.database.locks:
            enabled: true
          postgresql.deadlocks:
            enabled: true
          postgresql.sequential_scans:
            enabled: true
          postgresql.blks_hit:
            enabled: true
          postgresql.blks_read:
            enabled: true
          postgresql.temp_files:
            enabled: true
          postgresql.temp.io:
            enabled: true
          postgresql.tup_deleted:
            enabled: true
          postgresql.tup_fetched:
            enabled: true
          postgresql.tup_inserted:
            enabled: true
          postgresql.tup_returned:
            enabled: true
          postgresql.tup_updated:
            enabled: true
      prometheus:
        config:
          scrape_configs:
            - job_name: "pgcache"
              scrape_interval: 15s
              static_configs:
                - targets: ["pgcache-svc.{{ .Release.Namespace }}.svc.cluster.local:9090"]

    processors:
      batch:
        send_batch_size: 1000
        timeout: 5s
      memory_limiter:
        check_interval: 2s
        limit_mib: 150
      resource/postgres:
        attributes:
          - action: upsert
            key: host.name
            value: "postgres-origin-svc"
          - action: upsert
            key: service.name
            value: "postgres-origin"
          - action: upsert
            key: db.system
            value: "postgresql"

    exporters:
      otlp/signoz:
        endpoint: "signoz-otel-collector.{{ .Release.Namespace }}.svc.cluster.local:4317"
        tls:
          insecure: true

    service:
      pipelines:
        metrics:
          receivers: [postgresql, prometheus]
          processors: [resource/postgres, memory_limiter, batch]
          exporters: [otlp/signoz]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app: db-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-collector
  template:
    metadata:
      labels:
        app: db-collector
    spec:
      containers:
        - name: otel-collector
          image: "otel/opentelemetry-collector-contrib:latest"
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: suite-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: suite-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: suite-secrets
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: "30m"
              memory: "48Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
      volumes:
        - name: config
          configMap:
            name: db-collector-config
