{{- if .Values.openobserve.enabled }}
# ============================================================================
# 1. OPENOBSERVE STATEFULSET (Nó Dedicado: obs-pool | Logs + Métricas + Traces)
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openobserve
  namespace: {{ .Release.Namespace }}
  labels:
    app: openobserve
spec:
  serviceName: openobserve-svc
  replicas: 1
  selector:
    matchLabels:
      app: openobserve
  template:
    metadata:
      labels:
        app: openobserve
    spec:
      {{- if .Values.openobserve.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.openobserve.nodeSelector | indent 8 }}
      {{- end }}
      containers:
        - name: openobserve
          image: {{ .Values.openobserve.image | quote }}
          ports:
            - containerPort: 5080
              name: http
            - containerPort: 5081
              name: grpc
          env:
            - name: ZO_DATA_DIR
              value: "/data"
            - name: ZO_HTTP_PORT
              value: "5080"
            - name: ZO_GRPC_PORT
              value: "5081"
            - name: ZO_TELEMETRY
              value: "false"
            - name: ZO_ROOT_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: suite-secrets
                  key: ZO_ROOT_USER_EMAIL
            - name: ZO_ROOT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: suite-secrets
                  key: ZO_ROOT_USER_PASSWORD
          volumeMounts:
            - name: o2-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
{{ toYaml .Values.openobserve.resources | indent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: o2-data
        annotations:
          helm.sh/resource-policy: keep
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.openobserve.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.openobserve.storageSize | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: openobserve-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: openobserve
  ports:
    - name: http
      port: 5080
      targetPort: 5080
    - name: grpc
      port: 5081
      targetPort: 5081

{{- if .Values.openobserve.otelCollector.enabled }}
---
# ============================================================================
# 2. OPENTELEMETRY COLLECTOR DAEMONSET (Coleta Métricas de Hardware e Logs dos 4 Nós)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Release.Namespace }}
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      hostmetrics:
        collection_interval: 15s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          filesystem: {}
          load: {}
          network: {}
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: end
        include_file_path: true

    processors:
      batch:
        send_batch_size: 1000
        timeout: 5s
      memory_limiter:
        check_interval: 2s
        limit_mib: 200

    exporters:
      otlphttp/openobserve:
        endpoint: "http://openobserve-svc.{{ .Release.Namespace }}.svc.cluster.local:5080/api/default"
        headers:
          Authorization: "${env:OPENOBSERVE_BASIC_AUTH}"
          stream-name: "k8s-infra"

    service:
      pipelines:
        metrics:
          receivers: [otlp, hostmetrics]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/openobserve]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/openobserve]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/openobserve]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-node-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app: otel-node-collector
spec:
  selector:
    matchLabels:
      app: otel-node-collector
  template:
    metadata:
      labels:
        app: otel-node-collector
    spec:
      containers:
        - name: otel-collector
          image: {{ .Values.openobserve.otelCollector.image | quote }}
          args: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
          env:
            - name: OPENOBSERVE_BASIC_AUTH
              valueFrom:
                secretKeyRef:
                  name: suite-secrets
                  key: OPENOBSERVE_BASIC_AUTH
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
{{- end }}
{{- end }}
