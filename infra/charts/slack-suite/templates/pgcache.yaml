{{- if .Values.pgcache.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgcache
  namespace: {{ .Release.Namespace }}
  labels:
    app: pgcache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgcache
  template:
    metadata:
      labels:
        app: pgcache
    spec:
      {{- if .Values.pgcache.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.pgcache.nodeSelector | indent 8 }}
      {{- end }}
      containers:
        - name: pgcache
          image: {{ .Values.pgcache.image | quote }}
          ports:
            - containerPort: 5433
              name: pgcache
          env:
            - name: PGCACHE_LISTEN_ADDR
              value: "0.0.0.0:5433"
            - name: PGCACHE_ORIGIN_HOST
              value: "postgres-origin-svc"
            - name: PGCACHE_ORIGIN_PORT
              value: "5432"
            - name: PGCACHE_ORIGIN_USER
              valueFrom:
                secretKeyRef:
                  name: suite-secrets
                  key: POSTGRES_USER
            - name: PGCACHE_ORIGIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: suite-secrets
                  key: POSTGRES_PASSWORD
            - name: PGCACHE_ORIGIN_DB
              valueFrom:
                secretKeyRef:
                  name: suite-secrets
                  key: POSTGRES_DB
            - name: PGCACHE_CDC_PUBLICATION
              value: {{ .Values.pgcache.publicationName | quote }}
            - name: PGCACHE_CDC_SLOT
              value: {{ .Values.pgcache.slotName | quote }}
          resources:
{{ toYaml .Values.pgcache.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pgcache-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: pgcache
  ports:
    - name: pgcache
      port: 5433
      targetPort: 5433
{{- end }}
